[project]
name = "audio-separate"
version = "0.1.0"
description = "PDP Media Pipeline — voice separation, word alignment and speaker gender for video.dub"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
