name: Deploy

# After a green CI on main: the images ECR does not have yet, a release in S3, and when the cluster
# runs, the `pdp` release and scripts/smoke.sh against it (Stage 5b.3, docs/plan/stage-5b.md).
# Tags are content hashes (scripts/image-tags.mjs, docs/plan/stage-7.1.md): an image whose inputs
# did not change keeps its tag, is not rebuilt, and Helm does not roll its pods. With the cluster
# off the run is still green: `scripts/aws.sh up` deploys the current release later. The Rollback
# workflow deploys an earlier one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a running one is never cut off halfway through a Helm upgrade.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  # The commit CI verified, not whatever main points to by now.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # The ECR repositories (deploy/terraform/base/services.tf); webhook-receiver is local only.
  SERVICES: api-gateway metadata scheduler worker video-worker video-dub web audio-separate

jobs:
  # The tag of every service at SHA, and the images ECR does not have under that tag yet.
  plan:
    # Pushes only: a pull request from a fork may come from a branch named main too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # The role trusts this environment, and the environment admits only main. Only `release`
    # records a GitHub deployment: one per run, not one per job and image.
    environment:
      name: aws
      deployment: false
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      build: ${{ steps.missing.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: tags
        run: echo "tags=$(node scripts/image-tags.mjs --matrix)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Tags are immutable: an image ECR has under its tag is exactly the one this commit builds.
      - id: missing
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          build='[]'
          for app in $SERVICES; do
            entry=$(jq -c --arg app "$app" '.[] | select(.app == $app)' <<<"$TAGS")
            tag=$(jq -r .tag <<<"$entry")
            if aws ecr describe-images --repository-name "pdp/$app" \
              --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              echo "pdp/$app:$tag is already in ECR"
            else
              echo "pdp/$app:$tag is to be built"
              build=$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$build")
            fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

  images:
    name: images (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    environment:
      name: aws
      deployment: false
    timeout-minutes: 40
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Free disk space
        if: matrix.app == 'audio-separate' || matrix.app == 'video-dub'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      # The layer cache CI wrote on main; no provenance index, so ECR holds plain images.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.dockerfile }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/pdp/${{ matrix.app }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.app }}

  release:
    needs: [plan, images]
    # `images` is skipped when ECR has every image already.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      # Only once every image is in ECR. The release goes to S3 first; the tags in SSM and
      # current.json move once it runs. Nothing to deploy when the chart renders as the current.
      - name: Release
        env:
          PLAN_TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          TAGS=$(jq -c 'map({(.app): .tag}) | add' <<<"$PLAN_TAGS")
          export TAGS
          scripts/aws.sh release
      - name: Smoke test
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          state=$(aws eks describe-cluster --name pdp --query cluster.status --output text 2>/dev/null || true)
          if [ "$state" != ACTIVE ]; then
            echo "the cluster is off, nothing to test"
            exit 0
          fi
          scripts/smoke.sh https://api.pdp-media-pipeline.online
