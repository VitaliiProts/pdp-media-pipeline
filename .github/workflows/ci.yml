name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm depcruise

  # Coverage is reported, not enforced.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - run: pnpm test:web
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Unit test coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Testcontainers: Postgres, NATS, Redis and MinIO on the runner's Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int --coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage-int/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage-int/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Integration test coverage (apps)", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-int
          path: coverage-int/
          if-no-files-found: ignore

  # The Python service without its ML stack: models are faked, S3 is moto.
  audio-separate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/audio-separate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/audio-separate/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  # Report only: findings show up in the job summary and as warnings, the job never fails.
  # Blocking on CRITICAL is enabled in Stage 7.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (report only)
        run: |
          set +e
          pnpm audit > audit.txt 2>&1
          code=$?
          { echo "## pnpm audit"; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=pnpm audit::vulnerabilities found, see job summary"
          fi

  # helm lint, then kubeconform on the rendered platform and pdp (dev and prod) manifests.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: scripts/helm-check.sh

  # Formatting and validation only, without a backend or AWS credentials.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -recursive -check deploy/terraform
      - run: |
          for dir in deploy/terraform/*/; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/deploy/observability/vmalert:/vmalert:ro" \
            victoriametrics/vmalert-tool:v1.154.0 unittest --files=/vmalert/tests/alerts.test.yml

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          [
            api-gateway,
            metadata,
            scheduler,
            worker,
            video-worker,
            webhook-receiver,
            web,
            audio-separate,
          ]
        include:
          # The Debian dub image of the video worker (ADR-016).
          - app: video-dub
            dockerfile: video-worker
            target: dub
    steps:
      # The runner has ~14 GB free; the build cache, the tarball for `load` and the loaded image
      # of audio-separate (~6 GB unpacked) or video-dub take more. Unused toolchains free ~30 GB.
      - name: Free disk space
        if: matrix.app == 'audio-separate' || matrix.app == 'video-dub'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.dockerfile || matrix.app }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: pdp/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          # audio-separate carries ~3 GB of model weights and would evict every other cache.
          cache-to: ${{ matrix.app != 'audio-separate' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}
      # Official image pinned by version instead of aquasecurity/trivy-action (past tag hijacking).
      - name: Trivy image scan (report only)
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table pdp/${{ matrix.app }}:ci > trivy.txt 2>&1
          code=$?
          { echo "## Trivy: ${{ matrix.app }}"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Trivy ${{ matrix.app }}::HIGH/CRITICAL vulnerabilities found, see job summary"
          fi
