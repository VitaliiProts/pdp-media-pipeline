name: CI

# Only the jobs a change needs (docs/plan/stage-7.1.md): `changes` picks them, `ci-ok` is the one
# check that sums them up, whichever ran.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The images whose content tag changed and a flag per area, against the merge base with the
  # target branch, or with the previous main on a push. Without a base everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.select.outputs.images }}
      node: ${{ steps.select.outputs.node }}
      python: ${{ steps.select.outputs.python }}
      helm: ${{ steps.select.outputs.helm }}
      terraform: ${{ steps.select.outputs.terraform }}
      alerts: ${{ steps.select.outputs.alerts }}
      audit: ${{ steps.select.outputs.audit }}
      e2e: ${{ steps.select.outputs.e2e }}
      actions: ${{ steps.select.outputs.actions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-changes.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

  # Prettier checks Markdown and YAML too, so it runs on every change: a badly formatted file
  # would otherwise fail the next pull request that touches code.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  verify:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise

  test:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:cov
      - run: pnpm test:web:cov
      - run: pnpm test:tools
      - run: pnpm test:pact
      # Providers are verified against the committed pacts in `integration`.
      - name: Pacts are committed as the consumer tests write them
        run: |
          if [ -n "$(git status --porcelain pacts)" ]; then
            git status --short pacts && git diff pacts
            exit 1
          fi
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          # shellcheck disable=SC2016 # a JS template literal, not shell
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Unit test coverage", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            apps/web/coverage/
          if-no-files-found: ignore

  # Testcontainers: Postgres, NATS, Redis and MinIO on the runner's Docker.
  integration:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:int --coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage-int/coverage-summary.json') != ''
        run: |
          # shellcheck disable=SC2016 # a JS template literal, not shell
          node -e '
            const t = require("./coverage-int/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Integration test coverage (apps)", "", "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-int
          path: coverage-int/
          if-no-files-found: ignore

  # Unit and integration runs together, with the Web UI for the areas that span both. The
  # thresholds are on the whole run, which is why the Node jobs never run for a part of it.
  coverage:
    needs: [changes, test, integration]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Paths in the reports are absolute, and the same on every runner of this workflow.
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-int
          path: coverage-int
      - run: pnpm coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-merged
          path: coverage-merged/
          if-no-files-found: ignore

  # The Python service without its ML stack: models are faked, S3 is moto.
  audio-separate:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/audio-separate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/audio-separate/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  # Report only: findings show up in the job summary and as warnings, the job never fails.
  # Blocking on CRITICAL is enabled in Stage 7.
  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: pnpm audit (report only)
        run: |
          set +e
          pnpm audit > audit.txt 2>&1
          code=$?
          { echo "## pnpm audit"; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=pnpm audit::vulnerabilities found, see job summary"
          fi

  # helm lint, then kubeconform on the rendered platform and pdp (dev and prod) manifests.
  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: scripts/helm-check.sh

  # Formatting and validation only, without a backend or AWS credentials.
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -recursive -check deploy/terraform
      - run: |
          for dir in deploy/terraform/*/; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Trivy config scan (report only)
        run: |
          set +e
          docker run --rm -v "$PWD/deploy/terraform:/src:ro" \
            aquasec/trivy:0.75.0 config --quiet --severity HIGH,CRITICAL --exit-code 1 \
            --format table /src > trivy.txt 2>&1
          code=$?
          { echo "## Trivy: terraform"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Trivy terraform::HIGH/CRITICAL misconfigurations found, see job summary"
          fi

  alert-rules:
    needs: changes
    if: needs.changes.outputs.alerts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/deploy/observability/vmalert:/vmalert:ro" \
            victoriametrics/vmalert-tool:v1.154.0 unittest --files=/vmalert/tests/alerts.test.yml

  # The workflows themselves: expressions, job references, shell in `run` (shellcheck).
  actionlint:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Only the images whose content tag changed; the matrix entries come from scripts/image-tags.mjs.
  docker:
    name: docker (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      # The runner has ~14 GB free; the build cache, the tarball for `load` and the loaded image
      # of audio-separate (~6 GB unpacked) or video-dub take more. Unused toolchains free ~30 GB.
      - name: Free disk space
        if: matrix.app == 'audio-separate' || matrix.app == 'video-dub'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.dockerfile }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: pdp/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          # audio-separate carries ~3 GB of model weights and would evict every other cache.
          cache-to: ${{ matrix.app != 'audio-separate' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}
      # Official image pinned by version instead of aquasecurity/trivy-action (past tag hijacking).
      - name: Trivy image scan (report only)
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table pdp/${{ matrix.app }}:ci > trivy.txt 2>&1
          code=$?
          { echo "## Trivy: ${{ matrix.app }}"; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Trivy ${{ matrix.app }}::HIGH/CRITICAL vulnerabilities found, see job summary"
          fi

  # Three browser flows against the compose stack. The images come from the same Dockerfiles and
  # cache scopes as the `docker` job, so its layers are reused rather than built twice.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          source: .
          files: e2e/docker-bake.hcl
      - run: scripts/e2e.sh up
      - run: scripts/e2e.sh test
      - name: Compose logs
        if: failure()
        run: scripts/e2e.sh logs > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
            compose.log
          if-no-files-found: ignore

  # The one check to require: green when every job that ran passed, a skipped job included.
  ci-ok:
    if: always()
    needs:
      - changes
      - format
      - verify
      - test
      - integration
      - coverage
      - audio-separate
      - audit
      - helm
      - terraform
      - alert-rules
      - actionlint
      - docker
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ -n "$failed" ]; then
            echo "::error title=CI::$(echo "$failed" | paste -sd ', ' -)"
            exit 1
          fi
