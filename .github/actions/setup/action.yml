name: Setup
description: pnpm and Node from .nvmrc with the pnpm store cached, then the workspace installed.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
