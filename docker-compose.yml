name: pdp

# Host ports are shifted (5xxxx / 1808x) to avoid clashes with other local stacks.
# Override any of them via .env, e.g. POSTGRES_HOST_PORT=5432.

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: media

x-app: &app
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: info
    PORT: 3000
    # Traces, logs and metrics go to the collector; logs are also written to stdout.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    DEPLOYMENT_ENVIRONMENT: compose
    SERVICE_VERSION: dev
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1']
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pdp
      POSTGRES_PASSWORD: pdp
      POSTGRES_DB: metadata
    ports: ['${POSTGRES_HOST_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdp -d metadata']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_HOST_PORT:-56379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${NATS_HOST_PORT:-54222}:4222'
      - '${NATS_MONITOR_HOST_PORT:-58222}:8222'
    volumes: [nats-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

  # minio/minio is no longer published on Docker Hub; pgsty/minio is a drop-in community build.
  minio:
    image: pgsty/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_HOST_PORT:-59000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-59001}:9001'
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/media
    restart: 'no'

  # One-shot, like the Helm pre-install hook in Stage 5.
  metadata-migrate:
    build: { context: ., dockerfile: apps/metadata/Dockerfile }
    image: pdp/metadata:dev
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgres://pdp:pdp@postgres:5432/metadata
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  metadata:
    <<: *app
    image: pdp/metadata:dev
    environment:
      <<: *app-env
      DATABASE_URL: postgres://pdp:pdp@postgres:5432/metadata
      NATS_URL: nats://nats:4222
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-5368709120}
      ASSET_UNUSED_TTL_S: ${ASSET_UNUSED_TTL_S:-86400}
      ASSET_JANITOR_INTERVAL_MS: ${ASSET_JANITOR_INTERVAL_MS:-600000}
    ports: ['${METADATA_HOST_PORT:-18081}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      metadata-migrate: { condition: service_completed_successfully }

  api-gateway:
    <<: *app
    build: { context: ., dockerfile: apps/api-gateway/Dockerfile }
    image: pdp/api-gateway:dev
    environment:
      <<: [*app-env, *s3-env]
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      METADATA_URL: http://metadata:3000
      # Presigned URLs are signed for the host the client uses, not for minio:9000.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_HOST_PORT:-59000}
      # The web container's nginx sits in front; its X-Forwarded-For hop is the client.
      TRUST_PROXY_HOPS: 1
      # The Web UI in compose and in `pnpm dev:web`; sessions are accepted from these only.
      APP_ORIGINS: http://localhost:${WEB_HOST_PORT:-18090},http://localhost:5173
      RATE_LIMIT_USER_RPS: ${RATE_LIMIT_USER_RPS:-20}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-20}
      RATE_LIMIT_GLOBAL_RPS: ${RATE_LIMIT_GLOBAL_RPS:-200}
      RATE_LIMIT_GLOBAL_BURST: ${RATE_LIMIT_GLOBAL_BURST:-200}
      RATE_LIMIT_IP_RPS: ${RATE_LIMIT_IP_RPS:-10}
      RATE_LIMIT_IP_BURST: ${RATE_LIMIT_IP_BURST:-20}
      BACKPRESSURE_MAX_DEPTH_CPU: ${BACKPRESSURE_MAX_DEPTH_CPU:-2000}
      BACKPRESSURE_MAX_DEPTH_IO: ${BACKPRESSURE_MAX_DEPTH_IO:-2000}
      BACKPRESSURE_MAX_DEPTH_PRIORITY: ${BACKPRESSURE_MAX_DEPTH_PRIORITY:-500}
      # The only host allowed to resolve to a private address, so webhooks can reach it.
      EGRESS_PRIVATE_HOSTS: webhook-receiver
    ports: ['${GATEWAY_HOST_PORT:-18080}:3000']
    depends_on:
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
      metadata: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    build: { context: ., dockerfile: apps/scheduler/Dockerfile }
    image: pdp/scheduler:dev
    environment:
      <<: *app-env
      NATS_URL: nats://nats:4222
      METADATA_URL: http://metadata:3000
    ports: ['${SCHEDULER_HOST_PORT:-18082}:3000']
    depends_on:
      nats: { condition: service_healthy }
      metadata: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    image: pdp/worker:dev
    environment:
      <<: [*app-env, *s3-env]
      NATS_URL: nats://nats:4222
      METADATA_URL: http://metadata:3000
      WORKER_CONCURRENCY: 2
      EGRESS_PRIVATE_HOSTS: webhook-receiver
      # Short enough to see /slow time out without waiting long.
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-5000}
    ports: ['${WORKER_HOST_PORT:-18083}:3000']
    depends_on:
      nats: { condition: service_healthy }
      metadata: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  video-worker:
    <<: *app
    build: { context: ., dockerfile: apps/video-worker/Dockerfile }
    image: pdp/video-worker:dev
    environment:
      <<: [*app-env, *s3-env]
      NATS_URL: nats://nats:4222
      METADATA_URL: http://metadata:3000
      VIDEO_CONCURRENCY: 1
      VIDEO_JOB_TYPES: video.frames
    ports: ['${VIDEO_WORKER_HOST_PORT:-18085}:3000']
    depends_on:
      # The image worker must narrow its consumer filters first: filters on one
      # work-queue stream may not overlap.
      worker: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Same image, only video.transcode: a transcode taking minutes never holds the slot a
  # frames job is waiting for.
  video-transcode:
    <<: *app
    image: pdp/video-worker:dev
    pull_policy: never
    environment:
      <<: [*app-env, *s3-env]
      NATS_URL: nats://nats:4222
      METADATA_URL: http://metadata:3000
      VIDEO_CONCURRENCY: 1
      VIDEO_JOB_TYPES: video.transcode
    ports: ['${VIDEO_TRANSCODE_HOST_PORT:-18086}:3000']
    depends_on:
      # Built by video-worker.
      video-worker: { condition: service_healthy }

  # Test endpoint for webhooks: /ok, /fail, /status/<code>, /slow?ms=, /drop, /flaky?failures=.
  webhook-receiver:
    <<: *app
    build: { context: ., dockerfile: apps/webhook-receiver/Dockerfile }
    image: pdp/webhook-receiver:dev
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ['${WEBHOOK_RECEIVER_HOST_PORT:-18084}:3000']

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: pdp/web:dev
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://api-gateway:3000
      # Opened by the browser, so the host port rather than the service name.
      GRAFANA_URL: http://localhost:${GRAFANA_HOST_PORT:-13000}
    ports: ['${WEB_HOST_PORT:-18090}:8080']
    depends_on:
      api-gateway: { condition: service_healthy }

  # --- Observability (ADR-010). Apps do not wait for it: telemetry is best effort. ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    restart: unless-stopped
    depends_on: [tempo, victorialogs, victoriametrics]

  tempo:
    image: grafana/tempo:2.10.8
    command: ['-config.file=/etc/tempo.yaml']
    volumes: ['./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro']
    ports: ['${TEMPO_HOST_PORT:-13200}:3200']
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command: ['-storageDataPath=/vlogs', '-retentionPeriod=7d']
    volumes: [victorialogs-data:/vlogs]
    ports: ['${VICTORIALOGS_HOST_PORT:-19428}:9428']
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    command:
      - -storageDataPath=/vm
      - -retentionPeriod=30d
      # job.e2e.duration (s) is stored as job_e2e_duration_seconds_bucket, and so on.
      - -opentelemetry.usePrometheusNaming
      # Grafana lists vmalert's rules and alerts through the VictoriaMetrics datasource.
      - -vmalert.proxyURL=http://vmalert:8880
    volumes: [victoriametrics-data:/vm]
    ports: ['${VICTORIAMETRICS_HOST_PORT:-18428}:8428']
    restart: unless-stopped

  # Recording rules for the SLO and the alerts; their results are written back to VictoriaMetrics.
  vmalert:
    image: victoriametrics/vmalert:v1.154.0
    command:
      - -rule=/etc/vmalert/*.yml
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=15s
      - -external.url=http://localhost:${GRAFANA_HOST_PORT:-13000}
      - '-external.alert.source=d/pdp-slo/slo'
    volumes: ['./deploy/observability/vmalert/rules:/etc/vmalert:ro']
    ports: ['${VMALERT_HOST_PORT:-18880}:8880']
    restart: unless-stopped
    depends_on: [victoriametrics, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager']
    volumes: ['./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    ports: ['${ALERTMANAGER_HOST_PORT:-19093}:9093']
    restart: unless-stopped
    depends_on: [webhook-receiver]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0
      # Local stack only: no login, everyone is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/job.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['${GRAFANA_HOST_PORT:-13000}:3000']
    restart: unless-stopped
    depends_on: [tempo, victorialogs, victoriametrics, alertmanager]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  victorialogs-data:
  victoriametrics-data:
  grafana-data:
