# Fake OpenAI for the chaos runs; scripts/chaos.sh creates the openai-mock ConfigMap from
# perf/openai-mock/server.mjs and points video-dub at http://openai-mock:8080/v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-mock
  labels:
    app.kubernetes.io/name: openai-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openai-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openai-mock
    spec:
      containers:
        - name: openai-mock
          image: node:24-alpine
          command: [node, /app/server.mjs]
          env:
            - name: PORT
              value: '8080'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: openai-mock
---
apiVersion: v1
kind: Service
metadata:
  name: openai-mock
  labels:
    app.kubernetes.io/name: openai-mock
spec:
  selector:
    app.kubernetes.io/name: openai-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
