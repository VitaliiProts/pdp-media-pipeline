# Local cluster profile: one replica of everything, small volumes, no auth on the UIs.
# Every service keeps its docker-compose name (nats, minio, victoriametrics, tempo, ...),
# so deploy/observability configs and the pdp chart's env work unchanged.

ingress:
  domain: pdp.localhost
  hosts:
    - { name: grafana, service: grafana, port: 80 }
    - { name: vm, service: victoriametrics, port: 8428 }
    - { name: s3, service: minio, port: 9000 }
    - { name: minio, service: minio, port: 9001 }

postgres:
  name: postgres
  image: ghcr.io/cloudnative-pg/postgresql:17.11
  instances: 1
  storage: 2Gi
  database: metadata
  owner: pdp
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:7-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

minio:
  # minio/minio is no longer published; pgsty/minio is a drop-in community build.
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  mcImage: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: media
  storage: 5Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

nats:
  fullnameOverride: nats
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 2Gi
    # KEDA's nats-jetstream scaler reads consumer lag from here (Stage 5.3).
    monitor:
      enabled: true
  service:
    ports:
      monitor: { enabled: true }
      leafnodes: { enabled: false }
      websocket: { enabled: false }
      mqtt: { enabled: false }
  container:
    merge:
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 512Mi }
  natsBox:
    enabled: false

victoriametrics:
  server:
    fullnameOverride: victoriametrics
    retentionPeriod: 30d
    extraArgs:
      # job.e2e.duration (s) is stored as job_e2e_duration_seconds_bucket, and so on.
      opentelemetry.usePrometheusNaming: 'true'
      # Grafana lists vmalert's rules and alerts through the VictoriaMetrics datasource.
      vmalert.proxyURL: http://vmalert:8880
    persistentVolume:
      size: 4Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

victorialogs:
  server:
    fullnameOverride: victorialogs
    retentionPeriod: 7d
    persistentVolume:
      size: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

vmalert:
  server:
    fullnameOverride: vmalert
    datasource:
      url: http://victoriametrics:8428
    remoteWrite:
      url: http://victoriametrics:8428
    remoteRead:
      url: http://victoriametrics:8428
    configMap: vmalert-rules
    extraArgs:
      rule: [/config/*.yml]
      evaluationInterval: 15s
      external.url: http://grafana.pdp.localhost:19080
      external.alert.source: d/pdp-slo/slo
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  alertmanager:
    enabled: true
    fullnameOverride: alertmanager
    configMap: alertmanager-config
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

tempo:
  fullnameOverride: tempo
  tempo:
    # The chart passes its own -config.file first; the last one wins.
    extraArgs:
      config.file: /pdp/tempo.yaml
    extraVolumeMounts:
      - name: pdp-config
        mountPath: /pdp
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 512Mi }
  extraVolumes:
    - name: pdp-config
      configMap:
        name: tempo-config

otel-collector:
  fullnameOverride: otel-collector
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.162.0
  command:
    name: otelcol-contrib
  configMap:
    create: false
    existingName: otel-collector-config
  ports:
    jaeger-compact: { enabled: false }
    jaeger-thrift: { enabled: false }
    jaeger-grpc: { enabled: false }
    zipkin: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }

grafana:
  fullnameOverride: grafana
  testFramework:
    enabled: false
  env:
    GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0
    # Local cluster only: no login, everyone is an admin.
    GF_AUTH_ANONYMOUS_ENABLED: 'true'
    GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/job.json
  # Installing the VictoriaLogs plugin at start peaks above 384Mi (OOMKilled).
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 768Mi }
  extraConfigmapMounts:
    - name: datasources
      configMap: grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources
      readOnly: true
    - name: dashboard-providers
      configMap: grafana-dashboard-providers
      mountPath: /etc/grafana/provisioning/dashboards
      readOnly: true
    - name: dashboards
      configMap: grafana-dashboards
      mountPath: /var/lib/grafana/dashboards
      readOnly: true
