{{/*
UIs of the platform on http://<host>.<domain>:<port>; the app's own hosts are in the pdp chart.
s3.<domain> is what presigned upload URLs point to.
*/}}
{{- $domain := .Values.ingress.domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
spec:
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ printf "%s.%s" .name $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
    {{- end }}
