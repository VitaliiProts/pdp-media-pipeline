{{/*
The same files docker-compose mounts (files/observability links to deploy/observability).
Service names in this namespace match compose, so the configs need no changes.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  relay: |
    {{- .Files.Get "files/observability/otel-collector.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    {{- .Files.Get "files/observability/tempo.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  {{- (.Files.Glob "files/observability/vmalert/rules/*.yml").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yaml: |
    {{- .Files.Get "files/observability/alertmanager.yml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    {{- .Files.Get "files/observability/grafana/provisioning/datasources/datasources.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
data:
  dashboards.yaml: |
    {{- .Files.Get "files/observability/grafana/provisioning/dashboards/dashboards.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  {{- (.Files.Glob "files/observability/grafana/dashboards/*.json").AsConfig | nindent 2 }}
