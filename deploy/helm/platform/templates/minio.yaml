{{/*
S3 for the local cluster; Stage 5b replaces it with a real bucket. The credentials Secret
is the one the services read (`s3-credentials`), and MinIO uses it as its root user.
*/}}
{{- with .Values.minio }}
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
type: Opaque
stringData:
  accessKey: {{ .accessKey | quote }}
  secretKey: {{ .secretKey | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: { app.kubernetes.io/name: minio }
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: {{ .image }}
          args: [server, /data, --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: s3-credentials, key: accessKey } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: s3-credentials, key: secretKey } }
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 10
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: { app.kubernetes.io/name: minio }
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mc
          image: {{ .mcImage }}
          command: [sh, -c]
          args:
            - >-
              mc alias set local http://minio:9000 "$ACCESS_KEY" "$SECRET_KEY" &&
              mc mb --ignore-existing local/{{ .bucket }}
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: ACCESS_KEY
              valueFrom: { secretKeyRef: { name: s3-credentials, key: accessKey } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-credentials, key: secretKey } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
