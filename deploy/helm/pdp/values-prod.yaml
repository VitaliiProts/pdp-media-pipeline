# Production profile: two replicas of every stateless service, no test receiver, hosts
# and registry of the target environment. The Secrets listed in values.yaml are
# provisioned outside the chart. values-aws.yaml goes on top for EKS (RDS, S3 via Pod Identity).

global:
  image:
    registry: ghcr.io/vitaliiprots
    pullPolicy: IfNotPresent
  env:
    LOG_LEVEL: info
    DEPLOYMENT_ENVIRONMENT: prod

metadata:
  replicaCount: 2

api-gateway:
  autoscaling: { maxReplicas: 8 }
  env:
    S3_PUBLIC_ENDPOINT: https://s3.example.com
    APP_ORIGINS: https://app.example.com
  ingress:
    enabled: true
    hosts:
      - host: api.example.com
      - host: app.example.com
        paths: [/v1, /docs]

scheduler:
  replicaCount: 2

# Two of everything that holds a queue, so a node going away never stops a class.
worker-priority:
  autoscaling: { minReplicas: 2, maxReplicas: 6 }

worker-cpu:
  autoscaling: { minReplicas: 2, maxReplicas: 10 }

worker-io:
  autoscaling: { minReplicas: 2, maxReplicas: 4 }

video-frames:
  resources:
    requests: { cpu: '1', memory: 512Mi }
    limits: { cpu: '2', memory: 1Gi }
  autoscaling: { minReplicas: 2, maxReplicas: 6 }

video-transcode:
  resources:
    requests: { cpu: '2', memory: 1Gi }
    limits: { cpu: '2', memory: 1536Mi }
  autoscaling: { minReplicas: 2, maxReplicas: 10 }

video-dub:
  autoscaling: { minReplicas: 2, maxReplicas: 6 }

audio-separate:
  autoscaling: { minReplicas: 2, maxReplicas: 6 }

web:
  replicaCount: 2
  env:
    GRAFANA_URL: https://grafana.example.com
  ingress:
    enabled: true
    hosts:
      - host: app.example.com

webhook-receiver:
  enabled: false
