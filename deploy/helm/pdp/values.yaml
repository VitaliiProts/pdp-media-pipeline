# Defaults for a cluster with the `platform` chart (Postgres, Redis, NATS, MinIO and the
# observability stack) in the same namespace. Service names match docker-compose.
# Secrets are referenced, never stored here:
#   postgres-app    created by CloudNativePG, key `uri`
#   s3-credentials  keys `accessKey`, `secretKey`

global:
  image:
    registry: ''
    tag: ''
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    PORT: '3000'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    DEPLOYMENT_ENVIRONMENT: dev

metadata:
  env:
    NATS_URL: nats://nats:4222
  secretEnv:
    DATABASE_URL: { secret: postgres-app, key: uri }

api-gateway:
  env:
    REDIS_URL: redis://redis:6379
    NATS_URL: nats://nats:4222
    METADATA_URL: http://metadata:3000
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: media
    # Exactly one proxy in front: the ingress controller, also for the Web UI's /v1.
    TRUST_PROXY_HOPS: '1'
    # The local fallback limiter splits limits by this; autoscaling.minReplicas below.
    RATE_LIMIT_REPLICAS: '2'
  secretEnv: &s3-credentials
    S3_ACCESS_KEY: { secret: s3-credentials, key: accessKey }
    S3_SECRET_KEY: { secret: s3-credentials, key: secretKey }
  # Short CPU-bound requests (validation, signing, rate limits in Redis); two replicas
  # keep the API up while one node goes away.
  autoscaling:
    enabled: true
    metric: cpu
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

scheduler:
  env:
    NATS_URL: nats://nats:4222
    METADATA_URL: http://metadata:3000

# Workers scale on the lag of their JetStream consumers (ADR-012): lagThreshold is the
# slots per pod (WORKER_CONCURRENCY, WEBHOOK_CONCURRENCY, VIDEO_CONCURRENCY), so the
# target is one pod per that many waiting or running jobs.
worker-priority:
  env: &worker-env
    NATS_URL: nats://nats:4222
    METADATA_URL: http://metadata:3000
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: media
    WORKER_CONCURRENCY: '2'
    WORKER_CLASSES: priority
  secretEnv: *s3-credentials
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    lagThreshold: 2
    consumers:
      - { stream: JOBS_PRIORITY, consumer: worker-priority }

worker-cpu:
  env:
    <<: *worker-env
    WORKER_CLASSES: cpu
  secretEnv: *s3-credentials
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    lagThreshold: 2
    consumers:
      - { stream: JOBS_CPU, consumer: worker-cpu }

# Webhook deliveries wait on the network: 16 per pod, so lag rarely asks for a second one.
worker-io:
  env:
    <<: *worker-env
    WORKER_CLASSES: io
  secretEnv: *s3-credentials
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    lagThreshold: 16
    consumers:
      - { stream: JOBS_IO, consumer: worker-io }

video-frames:
  env: &video-env
    NATS_URL: nats://nats:4222
    METADATA_URL: http://metadata:3000
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: media
    VIDEO_CONCURRENCY: '1'
    VIDEO_JOB_TYPES: video.frames
  secretEnv: *s3-credentials
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    lagThreshold: 1
    consumers:
      - { stream: JOBS_PRIORITY, consumer: video-priority }
      - { stream: JOBS_CPU, consumer: video-cpu }

# Same image, only transcoding, so a transcode that takes minutes never holds the slot a
# frames job is waiting for.
video-transcode:
  env:
    <<: *video-env
    VIDEO_JOB_TYPES: video.transcode
  secretEnv: *s3-credentials
  # Two x264 encodes at once: a 1080p source peaked at about 560 MiB in compose.
  resources:
    requests: { cpu: '1', memory: 768Mi }
    limits: { cpu: '2', memory: 1536Mi }
  # A 60 s 1080p source takes about 20 s at 2 CPUs; longer ones are handed back.
  shutdownGraceSeconds: 60
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    lagThreshold: 1
    consumers:
      - { stream: JOBS_PRIORITY, consumer: video-transcode-priority }
      - { stream: JOBS_CPU, consumer: video-transcode-cpu }
    # Scale-down may pick a busy pod; a longer window means fewer handed-back encodes.
    scaleDown:
      stabilizationWindowSeconds: 120
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]

web:
  enabled: true

webhook-receiver:
  enabled: false
