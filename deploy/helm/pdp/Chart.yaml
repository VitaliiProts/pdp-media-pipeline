apiVersion: v2
name: pdp
description: PDP Media Pipeline — all services in one release
type: application
version: 0.1.0
appVersion: dev
dependencies:
  - name: metadata
    version: 0.2.0
    repository: file://../metadata
  - name: api-gateway
    version: 0.2.0
    repository: file://../api-gateway
  - name: scheduler
    version: 0.2.0
    repository: file://../scheduler
  # One deployment per queue class (WORKER_CLASSES), so each scales on its own lag.
  - name: worker
    alias: worker-priority
    version: 0.2.0
    repository: file://../worker
  - name: worker
    alias: worker-cpu
    version: 0.2.0
    repository: file://../worker
  - name: worker
    alias: worker-io
    version: 0.2.0
    repository: file://../worker
  # The video worker image twice: frames and transcoding (VIDEO_JOB_TYPES).
  - name: video-worker
    alias: video-frames
    version: 0.2.0
    repository: file://../video-worker
  - name: video-worker
    alias: video-transcode
    version: 0.2.0
    repository: file://../video-worker
  - name: web
    version: 0.2.0
    repository: file://../web
    condition: web.enabled
  - name: webhook-receiver
    version: 0.2.0
    repository: file://../webhook-receiver
    condition: webhook-receiver.enabled
