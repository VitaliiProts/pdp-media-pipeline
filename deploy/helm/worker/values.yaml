image:
  repository: pdp/worker
  tag: ''
replicaCount: 1
serviceVersionEnv: true
# sharp keeps decoded pixels in native memory, outside the V8 heap.
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 512Mi }
env: {}
secretEnv: {}
# On rollout or scale-down a running job gets this long, then goes back to the queue
# without using up an attempt (ADR-012).
shutdownGraceSeconds: 20
# See pdp-lib/templates/_scaling.tpl.
autoscaling:
  enabled: false
