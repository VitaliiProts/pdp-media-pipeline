image:
  repository: pdp/api-gateway
  tag: ''
replicaCount: 1
serviceVersionEnv: true
# Endpoint removal reaches the ingress before SIGTERM stops the server.
preStopSleepSeconds: 5
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: '1', memory: 256Mi }
env: {}
secretEnv: {}
ingress:
  enabled: false
