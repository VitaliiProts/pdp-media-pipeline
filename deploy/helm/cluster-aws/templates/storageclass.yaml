# Volumes of NATS, Redis and observability. Delete: a volume goes with its PVC, so
# `aws.sh down` leaves no EBS behind once the PVCs are gone.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: 'true'
