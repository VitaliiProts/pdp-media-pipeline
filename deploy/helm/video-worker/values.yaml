image:
  repository: pdp/video-worker
  tag: ''
replicaCount: 1
serviceVersionEnv: true
# One ffmpeg at a time per pod (VIDEO_CONCURRENCY=1): scale with pods, not threads.
resources:
  requests: { cpu: 500m, memory: 384Mi }
  limits: { cpu: '2', memory: 1Gi }
env:
  VIDEO_WORK_DIR: /work
secretEnv: {}
# Sources of up to MAX_VIDEO_BYTES (100 MB) plus extracted frames, off the root filesystem.
extraVolumes:
  - name: work
    emptyDir:
      sizeLimit: 1Gi
extraVolumeMounts:
  - name: work
    mountPath: /work
