{{- if .Values.migrations.enabled }}
{{/*
Runs before the Deployment on install and before the rollout on upgrade, so new pods
never meet an old schema. The Secret with DATABASE_URL must exist beforehand: hooks run
before the release's own resources are created.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pdp-lib.name" . }}-migrate
  labels:
    app.kubernetes.io/name: {{ include "pdp-lib.name" . }}-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ include "pdp-lib.tag" . | quote }}
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: pdp-media-pipeline
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # Kept after success so its logs can be read; replaced by the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pdp-lib.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "pdp-lib.image" . }}
          imagePullPolicy: {{ include "pdp-lib.pullPolicy" . }}
          command: [node, dist/migrate.js]
          env:
            {{- include "pdp-lib.env" . | trim | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            {{- include "pdp-lib.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
