# Single-binary Tempo for local use. Blocks live in /tmp inside the container, which the
# image's non-root user can write; traces are lost when the container is recreated.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

# Live traces are held in memory. After an outage the collector replays its queue at once,
# which without these limits outgrew the 512Mi limit on every restart (OOMKilled loop).
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 3000000
      burst_size_bytes: 6000000
      max_traces_per_user: 5000

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
