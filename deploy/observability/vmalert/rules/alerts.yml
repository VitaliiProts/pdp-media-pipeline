# `severity: page` wakes someone up, `severity: ticket` can wait for working hours.
# Alertmanager sends both to webhook-receiver in the compose stack.
groups:
  - name: job-alerts
    interval: 15s
    rules:
      # Multi-window, multi-burn-rate: the long window proves the burn is significant,
      # the short one that it is still going on, so the alert resolves soon after a fix.
      - alert: JobSloBurnRateFast
        expr: job:slo_burn_rate:rate1h > 14.4 and job:slo_burn_rate:rate5m > 14.4
        for: 1m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.type }}: error budget burns over 14.4x (1h and 5m)'
          description: >-
            At this rate the 30-day budget is gone in about two days. Slow and failed jobs
            are on the SLO and Overview dashboards; their traces are one click away.

      - alert: JobSloBurnRateSlow
        expr: job:slo_burn_rate:rate6h > 6 and job:slo_burn_rate:rate30m > 6
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.type }}: error budget burns over 6x (6h and 30m)'
          description: At this rate the 30-day budget is gone in about five days.

      # At least 20 finished jobs, so one bad file in a quiet hour does not alert.
      - alert: JobDeadLetterShareHigh
        expr: |
          (
            sum by (type) (increase(jobs_dlq_total[15m]))
            /
            sum by (type) (increase(jobs_finished_total[15m]))
          ) > 0.01
          and sum by (type) (increase(jobs_finished_total[15m])) >= 20
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.type }}: over 1% of finished jobs went to the DLQ (15m)'
          description: Reasons are in jobs_dlq_total{reason}; the jobs can be redriven from the UI.

      # Messages no consumer has picked up yet: workers down, too slow, or out of slots.
      - alert: JobQueueGrowing
        expr: |
          max by (stream, consumer) (nats_consumer_pending) > 100
          and max by (stream, consumer) (deriv(nats_consumer_pending[5m])) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.stream }}/{{ $labels.consumer }}: backlog over 100 and growing'
          description: See the Queues dashboard; the gateway starts answering 503 at its backpressure limit.

  - name: dub-alerts
    interval: 15s
    rules:
      # An open breaker fails a call fast and hands the job back for later (ADR-016); open for
      # 10 minutes means the provider is down, not a burst of 5xx. A breaker only leaves `open`
      # on the next call, so the calls failing in the window are what keeps it firing.
      - alert: DubProviderCircuitOpen
        expr: |
          max by (provider) (dub_breaker_state) == 2
          and on (provider)
          sum by (provider) (
            increase(dub_provider_duration_seconds_count{outcome="unavailable"}[10m])
          ) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.provider }}: circuit breaker open for 10 minutes'
          description: >-
            Dubs wait for the provider and come back when it answers; recognition that stays
            down ends as dead with stt_unavailable. See the Dub dashboard and the provider status.

  - name: auth-alerts
    interval: 15s
    rules:
      # A mistyped password now and then is normal; dozens a minute across all users is
      # someone guessing. Throttled attempts count too: they are the guessing the limit stopped.
      - alert: LoginFailuresSpike
        expr: sum(rate(auth_logins_total{outcome=~"invalid_credentials|rate_limited"}[5m])) * 60 > 30
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: Over 30 failed or throttled logins a minute (5m)
          description: >-
            Password guessing or credential stuffing (ADR-013). The per-IP and per-email limits
            hold it back; find the sources in the gateway logs for POST /v1/auth/login.
