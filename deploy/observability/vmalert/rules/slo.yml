# SLO of ADR-001, ADR-008 and ADR-011, over 30 days:
#   image.resize     99% succeed within 5 minutes of creation
#   video.frames     95% within 5 minutes
#   video.transcode  95% within 10 minutes
#
# SLI = jobs that succeeded within the threshold / jobs that finished, without `permanent`
# failures: those are rejected input (a broken file, a 404 URL), which retries cannot fix
# and which are not the pipeline's latency. Redriven generations are not in job_e2e_duration
# at all.
#
# The threshold is the `le` label of the objective, so "within the threshold" is that one
# histogram bucket, picked per type by `and on (type, le)`.
#
# Burn rate = error ratio / (1 - objective). 1 means the budget lasts exactly 30 days;
# 14.4 spends 2% of it in an hour, 6 spends 5% in six hours (Google SRE workbook, ch. 5).
#
# `increase`, not `rate`: VictoriaMetrics counts a series that appeared inside the window
# from zero only in `increase`, and an outcome's series appears with its first job.
groups:
  - name: job-slo
    interval: 15s
    rules:
      - record: job:slo_objective:ratio
        expr: vector(0.99)
        labels: { type: image.resize, le: '300' }
      - record: job:slo_objective:ratio
        expr: vector(0.95)
        labels: { type: video.frames, le: '300' }
      - record: job:slo_objective:ratio
        expr: vector(0.95)
        labels: { type: video.transcode, le: '600' }

      - record: job:slo_errors:ratio_rate5m
        expr: |
          1 - (
            sum by (type) (
              increase(job_e2e_duration_seconds_bucket{outcome="succeeded"}[5m])
                and on (type, le) job:slo_objective:ratio
            )
            /
            sum by (type) (increase(job_e2e_duration_seconds_count{outcome!="permanent"}[5m]))
          )
      - record: job:slo_errors:ratio_rate30m
        expr: |
          1 - (
            sum by (type) (
              increase(job_e2e_duration_seconds_bucket{outcome="succeeded"}[30m])
                and on (type, le) job:slo_objective:ratio
            )
            /
            sum by (type) (increase(job_e2e_duration_seconds_count{outcome!="permanent"}[30m]))
          )
      - record: job:slo_errors:ratio_rate1h
        expr: |
          1 - (
            sum by (type) (
              increase(job_e2e_duration_seconds_bucket{outcome="succeeded"}[1h])
                and on (type, le) job:slo_objective:ratio
            )
            /
            sum by (type) (increase(job_e2e_duration_seconds_count{outcome!="permanent"}[1h]))
          )
      - record: job:slo_errors:ratio_rate6h
        expr: |
          1 - (
            sum by (type) (
              increase(job_e2e_duration_seconds_bucket{outcome="succeeded"}[6h])
                and on (type, le) job:slo_objective:ratio
            )
            /
            sum by (type) (increase(job_e2e_duration_seconds_count{outcome!="permanent"}[6h]))
          )

      - record: job:slo_burn_rate:rate5m
        expr: job:slo_errors:ratio_rate5m / on (type) group_left () (1 - job:slo_objective:ratio)
      - record: job:slo_burn_rate:rate30m
        expr: job:slo_errors:ratio_rate30m / on (type) group_left () (1 - job:slo_objective:ratio)
      - record: job:slo_burn_rate:rate1h
        expr: job:slo_errors:ratio_rate1h / on (type) group_left () (1 - job:slo_objective:ratio)
      - record: job:slo_burn_rate:rate6h
        expr: job:slo_errors:ratio_rate6h / on (type) group_left () (1 - job:slo_objective:ratio)
