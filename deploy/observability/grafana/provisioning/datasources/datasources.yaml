apiVersion: 1

datasources:
  # `$$` keeps Grafana from expanding these templates as environment variables.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # "Logs for this span" opens every log line of the trace, from all services.
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: 'trace_id:="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
      search:
        hide: false

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    jsonData:
      # Every log line written inside a span links to its trace.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
          datasourceUid: tempo
