# Services export OTLP/HTTP here; the collector is the only place that knows the backends.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  # The SDK's process detector adds these to every span and log line; host.name (the
  # container) and the runtime version are enough to tell instances apart.
  resource/slim:
    attributes:
      - { key: process.command, action: delete }
      - { key: process.command_args, action: delete }
      - { key: process.executable.path, action: delete }
      - { key: process.owner, action: delete }
  # VictoriaMetrics turns every resource attribute into a label. Only these name a series:
  # with the pid or runtime version in it, every restart would start new series.
  transform/metrics:
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "deployment.environment.name", "host.name"])

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    # What piles up while Tempo is down is sent the moment it is back; beyond this it is
    # dropped rather than flooding Tempo.
    sending_queue:
      queue_size: 50
  otlp_http/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    headers:
      # One log stream per service; everything else stays a regular, searchable field.
      VL-Stream-Fields: service.name,deployment.environment.name
  otlp_http/victoriametrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/slim, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/slim, batch]
      exporters: [otlp_http/victorialogs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/metrics, batch]
      exporters: [otlp_http/victoriametrics]
