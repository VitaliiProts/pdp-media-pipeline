# cert-manager: the wildcard certificate through DNS-01 in Route 53 (deploy/helm/cluster-aws).

crds:
  enabled: true

# The name of its Pod Identity association in the cluster layer.
serviceAccount:
  name: cert-manager

resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
cainjector:
  resources:
    requests: { cpu: 10m, memory: 96Mi }
    limits: { memory: 256Mi }
