  <path d="M1340 320 a24 24 0 0 1 24 -24 h312 a24 24 0 0 1 24 24 v536 a24 24 0 0 1 -24 24 h-312 a24 24 0 0 1 -24 -24 z" fill="#fff" stroke="#9ca3af"/>
  <rect x="1490" y="306" width="60" height="5" rx="2" fill="#d1d5db"/>
  <text x="1360" y="346" font-size="20" font-weight="700">Завантаження файлів</text>
  <rect x="1644" y="324" width="36" height="36" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="1655" y="348" font-size="16">✕</text>
  <rect x="1360" y="372" width="320" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="1400" y="428" font-size="16">Торкніться, щоб вибрати</text>
  <text x="1420" y="456" font-size="12">фото до 25 МБ, відео до 500 МБ</text>
  <text x="1360" y="528" font-size="15" font-weight="700">Що зробити з фото</text>
  <rect x="1360" y="547" width="16" height="16" rx="3" fill="#fff" stroke="#9ca3af"/>
  <text x="1388" y="560" font-size="14">Мініатюра · 320 px</text>
  <rect x="1360" y="577" width="16" height="16" rx="3" fill="#fff" stroke="#9ca3af"/>
  <text x="1388" y="590" font-size="14">Середній · 960 px</text>
  <rect x="1360" y="607" width="16" height="16" rx="3" fill="#fff" stroke="#9ca3af"/>
  <text x="1388" y="620" font-size="14">Великий · 1600 px</text>
  <text x="1360" y="670" font-size="15" font-weight="700">Що зробити з відео</text>
  <circle cx="1368" cy="697" r="8" fill="#fff" stroke="#9ca3af"/>
  <text x="1388" y="702" font-size="14">Кадри</text>
  <circle cx="1368" cy="727" r="8" fill="#fff" stroke="#9ca3af"/>
  <text x="1388" y="732" font-size="14">Транскодинг</text>
  <circle cx="1368" cy="757" r="8" fill="#fff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="1388" y="762" font-size="14">Переклад (5d)</text>
  <text x="1360" y="820" font-size="12">Нижній аркуш на всю ширину</text>
