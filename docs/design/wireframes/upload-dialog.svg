  <text x="370" y="742" font-size="13">Esc і клік по фону закривають; фокус повертається на кнопку «Завантажити»</text>
  <!-- mobile -->
  <!-- mobile header -->
  <rect x="1360" y="70" width="120" height="24" rx="0" fill="#d1d5db"/>
  <rect x="1574" y="64" width="44" height="36" rx="6" fill="#9ca3af" stroke="#9ca3af"/>
