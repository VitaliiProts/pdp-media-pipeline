  <!-- mobile -->
  <rect x="1360" y="70" width="150" height="24" fill="#d1d5db"/><rect x="1620" y="64" width="60" height="36" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="1634" y="88" font-size="13">Меню</text>
