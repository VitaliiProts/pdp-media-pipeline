  <rect x="60" y="70" width="220" height="28" fill="#d1d5db"/>
  <rect x="980" y="66" width="70" height="36" rx="6" fill="#e5e7eb" stroke="#9ca3af"/><text x="996" y="90" font-size="14">UA EN</text>
